<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091329"/>
      <stop offset="0.5" stop-color="#0B1F30"/>
      <stop offset="1" stop-color="#06121C"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#91F0C9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#91F0C9" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="52" fill="#91F0C9" opacity="0.16" filter="url(#bloom)"/>
  <g>
    <ellipse cx="100" cy="66" rx="22" ry="40" fill="url(#petal)" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="66" rx="22" ry="40" fill="url(#petal)" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="66" rx="22" ry="40" fill="url(#petal)" transform="rotate(120 100 100)"/>
    <ellipse cx="100" cy="66" rx="22" ry="40" fill="url(#petal)" transform="rotate(180 100 100)"/>
    <ellipse cx="100" cy="66" rx="22" ry="40" fill="url(#petal)" transform="rotate(240 100 100)"/>
    <ellipse cx="100" cy="66" rx="22" ry="40" fill="url(#petal)" transform="rotate(300 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="15" fill="#E9FFDA"/>
</svg>
